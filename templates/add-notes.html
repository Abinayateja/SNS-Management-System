{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="../static/css/addnotes.css">

<div class="outer-container">

    <div class="image-container">
        <img src="../static/images/notes-removebg-preview.png" alt="Notes">
    </div>

    <div class="notes-section">

        <form action="/add-notes" method="POST">

            <h1 class="head">Add Notes</h1>

            <p class="caption">Add new notes for your reference</p>

            <label for="title">Title</label>
            <input type="text" name="title" id="title">

            <label for="body">Body</label>
            <textarea name="body" id="body"></textarea>

            <button type="submit" id="add-btn">Save Notes</button>

        </form>

    </div>

</div>

{% endblock %}
