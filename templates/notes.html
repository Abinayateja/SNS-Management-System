{% extends "base.html" %}

{% block navmenu %}
<nav>
    <div class="nav-container">
        <div>
            <a href="{{url_for('profile')}}">
                <div class="profile-pic">
                    <img src="../static/images/profile.jpeg" alt="Profile">
                </div>
            </a>
        </div>
        <div class="right-nav">

            <div>
                <a href="{{url_for('dashboard')}}">Dashboard</a>
            </div>
            <div>
                <a href="{{url_for('files')}}">Files</a>
            </div>
            <div>
                <a href="{{url_for('notes')}}">Notes</a>
            </div>
            <div>
                <a href="{{url_for('profile')}}">Profile</a>
            </div>
            <div>
                <a href="{{url_for('logout')}}">Logout</a>
            </div>
        </div>
    </div>
</nav>
{% endblock %}

{% block content %}

<link rel="stylesheet" href="../static/css/notes.css">

<div class="outer-container">

    <div class="header">
        <h1>Notes</h1>
        <a href="/add-notes"><button type="submit" id="add-btn">Add Now</button></a>

    </div>

    <div class="content">

        <div class="image-container">
            <img src="../static/images/notes-removebg-preview.png" alt="">
        </div>

        <div class="notes-section">

            <form class="search-container" action="/notes">
                <label for="search">Search</label>
                <input type="search" id="search" name="search">
                <input type="submit" value="Search" id="search-btn">
                <a href="/notes" id="lnk"><input type="text" id="filter-btn" value="Remove Filters"></a>
            </form>
            
            <div class="grid">
                {% for note in notes %}
                <div class="card" onclick="location.href='/notes/{{ note.notesid }}'">
                    <div class="close-icon-con"
                        onclick="event.stopPropagation(); location.href='/notes/delete/{{ note.notesid }}'">
                        <i class="fa-regular fa-circle-xmark close-icon"></i>
                    </div>
                    <h1>{{ note.title }}</h1>
                </div>
                {% endfor %}
            </div>

        </div>

    </div>

</div>
<script src="https://kit.fontawesome.com/7a16a8d132.js" crossorigin="anonymous"></script>
{% endblock %}
