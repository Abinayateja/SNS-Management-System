{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="../static/css/detailed_notes.css">

<div class="outer-container">

    <div class="header">
        <h1>Your Note</h1>
    </div>

    <div class="content">

        <div class="image-container">
            <img src="../static/images/notes-removebg-preview.png" alt="">
        </div>

        <div class="notes-section">
            {% if note %}
            <div class="container">
                <div class="edit-icon-container">
                    <i class="fa-solid fa-pen edit-icon"></i>
                </div>
                <h1>{{note.title}}</h1>
                <p>{{note.content}}</p>
                <p>Modified at : {{note.updated_at}}</p>
            </div>
            {% endif %}

        </div>

    </div>
    <script src="https://kit.fontawesome.com/7a16a8d132.js" crossorigin="anonymous"></script>
    {% endblock %}
